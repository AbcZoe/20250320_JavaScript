<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Javascript作業</title>
        <link rel="stylesheet" href="style.css">
        <script>
            function myFunction(){
                var n=document.getElementById("numberInput").value;
                //alert產生對話方塊
                alert("輸入的數值是:"+n)

                var str="<table>";
                //let不會被更新的變數型態
                for(let i=1;i<=n;i++){
                    str+="<tr>"
                    for(let j=1;j<=n;j++){
                        //`${}`JavaScript的差補字串
                        str+=`<td>${i} * ${j} = ${i*j}</td>`
                    }
                    str+="</tr>"
                }
                str+="</table>"

                document.getElementById("myId").innerHTML=str;
            }
        </script>
    </head>
    <body>
        <div id="top">
            <a class="top_a" href="index.html">首頁</a>
            <a class="top_a" href="about.html">關於我</a>
            <a class="top_a" href="study.html">學習歷程</a>
            <a class="top_a" href="myproject.html">我的作品</a>
            <a class="top_a" href="homework.html">作業1_乘法表</a>
            <a class="top_a" href="https://abczoe.github.io/JavaScript_WaterPuzzle/" target="_blank">作業2_倒水遊戲</a>
            <a class="top_a" href="https://abczoe.github.io/AboutReact/" target="_blank">作業3_react網頁</a>
        </div>
        <h1>N*N乘法表</h1>
        <div>
            <label for="numberInput">請輸入一個數值:</label>
            <input type="number" id="numberInput" placeholder="輸入一個數值">
            <input type="button" value="Sumit" title="OK" onclick="myFunction()">
            <div id="myId"></div>
        </div>
    </body>
</html>
